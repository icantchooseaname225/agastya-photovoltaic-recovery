<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700">
<rect width="100%" height="100%" fill="#fff"/>
<text x="36" y="42" font-family="Arial" font-size="24" font-weight="bold">Stage 2 bench status and stop architecture</text>
<text x="36" y="70" font-family="Arial" font-size="14" fill="#444">Concept only: hardware interruption is separate from MCU status monitoring</text>
<rect x="50" y="150" width="230" height="135" rx="10" fill="#fff3e0" stroke="#444" stroke-width="2"/>
<text x="75" y="184" font-family="Arial" font-size="18" font-weight="bold">E-stop NC channel A+B</text><text x="75" y="216" font-family="Arial" font-size="14">Wired to safety relay input</text><text x="75" y="244" font-family="Arial" font-size="13">Selected hardware / rating TBD</text>
<rect x="375" y="150" width="210" height="135" rx="10" fill="#e8f5e9" stroke="#444" stroke-width="2"/>
<text x="405" y="190" font-family="Arial" font-size="18" font-weight="bold">Safety relay</text><text x="400" y="220" font-family="Arial" font-size="14">Reset / diagnostics TBD</text><text x="400" y="250" font-family="Arial" font-size="13">Not designed or selected</text>
<rect x="700" y="130" width="330" height="175" rx="10" fill="#ffebee" stroke="#b71c1c" stroke-width="2"/>
<text x="735" y="170" font-family="Arial" font-size="18" font-weight="bold">Separate servo power rail</text><text x="735" y="204" font-family="Arial" font-size="14">Relay output interrupts supply</text><text x="735" y="234" font-family="Arial" font-size="13">Fuse, supply, contact rating TBD</text><text x="735" y="265" font-family="Arial" font-size="13">Gravity axes may fall when power cuts</text>
<path d="M280 218 H375" stroke="#222" stroke-width="4" marker-end="url(#a)"/><path d="M585 218 H700" stroke="#222" stroke-width="4" marker-end="url(#a)"/>
<rect x="100" y="400" width="300" height="100" rx="10" fill="#e3f2fd" stroke="#444" stroke-width="2"/>
<text x="125" y="438" font-family="Arial" font-size="17" font-weight="bold">Auxiliary status NC contact</text><text x="125" y="470" font-family="Arial" font-size="14">10 kohm pull-up, 5 V logic</text>
<rect x="520" y="400" width="310" height="100" rx="10" fill="#e3f2fd" stroke="#444" stroke-width="2"/>
<text x="555" y="438" font-family="Arial" font-size="17" font-weight="bold">Arduino Mega status input</text><text x="555" y="470" font-family="Arial" font-size="14">Fault indication / jog inhibit only</text>
<path d="M475 285 V350 H250 V400" fill="none" stroke="#1565c0" stroke-width="3"/>
<path d="M400 450 H520" stroke="#1565c0" stroke-width="3" marker-end="url(#b)"/>
<text x="52" y="570" font-family="Arial" font-size="14" font-weight="bold" fill="#b71c1c">Limit switches in this demo are software status inputs and do not replace a safety-rated stop system.</text>
<text x="52" y="602" font-family="Arial" font-size="13" fill="#444">Do not energize until relay, contacts, power, guarding, load support and review are specified by a qualified supervisor.</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/></marker></defs>
</svg>
