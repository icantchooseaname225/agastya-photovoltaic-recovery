 <path d="M557 338H683L730 297H604Z" fill="#96a45c" stroke="#4c6335" stroke-width="3"/>
 <path d="M683 338V435L730 394V297" fill="none" stroke="#81934f" stroke-width="17"/>
 <path d="M557 338h126M604 297h126" stroke="#81934f" stroke-width="16"/>
 <path d="M610 423l25-45 32-20 20 16-21 27-30 28" fill="none" stroke="#d1a64e" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
 <circle cx="635" cy="378" r="10" fill="#e7c36b" stroke="#876a31" stroke-width="2"/><circle cx="667" cy="358" r="9" fill="#e7c36b" stroke="#876a31" stroke-width="2"/>
 <path d="M680 397l12-7 9 8-9 12-13-4z" fill="#53645a" stroke="#34453c" stroke-width="2"/>
