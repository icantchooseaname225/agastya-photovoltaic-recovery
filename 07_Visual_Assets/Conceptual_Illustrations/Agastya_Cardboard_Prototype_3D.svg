<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#faf8f1"/><stop offset="1" stop-color="#eee9dc"/></linearGradient>
 <linearGradient id="table" x2="0" y2="1"><stop stop-color="#d4c5a8"/><stop offset="1" stop-color="#bda886"/></linearGradient>
 <linearGradient id="kraft" x2="0" y2="1"><stop stop-color="#e2c99d"/><stop offset="1" stop-color="#bb9666"/></linearGradient>
 <filter id="shadow" x="-20%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#493d2c" flood-opacity=".24"/></filter>
 <pattern id="corrugation" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M2 0V12M8 0V12" stroke="#8e714e" stroke-width=".8" opacity=".28"/></pattern>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#276b60"/></marker>
 <style>
 .title{font:700 38px 'Segoe UI',Arial,sans-serif;fill:#243c34}.subtitle{font:400 18px 'Segoe UI',Arial,sans-serif;fill:#5e6b5e}
 .lab{font:700 15px 'Segoe UI',Arial,sans-serif;fill:#243c34}.desc{font:400 13px 'Segoe UI',Arial,sans-serif;fill:#4f6259}
 .tiny{font:700 11px 'Segoe UI',Arial,sans-serif;letter-spacing:.5px}.tag{font:700 13px 'Segoe UI',Arial,sans-serif;letter-spacing:.8px}
 </style>
</defs>
<!-- warm workshop backdrop -->
<rect width="1500" height="1000" fill="url(#wall)"/>
<path d="M0 705H1500V1000H0Z" fill="url(#table)"/>
<path d="M0 731H1500" stroke="#b19b78" stroke-width="3" opacity=".55"/>
<ellipse cx="760" cy="700" rx="580" ry="100" fill="#72614a" opacity=".18"/>
<!-- heading -->
<text x="58" y="62" class="title">AGASTYA | CARDBOARD DISPLAY MODEL</text>
<text x="60" y="96" class="subtitle">A zero-cost, non-working mock-up made from reused packaging</text>
<rect x="1152" y="42" width="292" height="44" rx="22" fill="#fff1d5" stroke="#d7b973" stroke-width="2"/><text x="1298" y="69" text-anchor="middle" class="tag" fill="#795615">NON-WORKING • HAND-MOVED PANEL</text>

<!-- BASE: thick corrugated slab in perspective -->
<g filter="url(#shadow)">
 <path d="M155 550L1110 550L1275 407L320 407Z" fill="#ddc39b" stroke="#8c704b" stroke-width="4"/>
 <path d="M155 550H1110V622H155Z" fill="#a88458" stroke="#806541" stroke-width="3"/>
 <path d="M1110 550L1275 407V479L1110 622Z" fill="#967347" stroke="#806541" stroke-width="3"/>
 <path d="M155 550L1110 550L1275 407L320 407Z" fill="url(#corrugation)" opacity=".85"/>
</g>
<!-- top work surface -->
