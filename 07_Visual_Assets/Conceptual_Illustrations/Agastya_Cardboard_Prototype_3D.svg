 <path d="M990 350h81l39-34h-81z" fill="#dce2ec" stroke="#9ba7b7" stroke-width="2"/>
 <ellipse cx="1037" cy="348" rx="23" ry="14" fill="#b88754" stroke="#704e32" stroke-width="3"/><path d="M1014 348v27M1060 348v-27" stroke="#704e32" stroke-width="3"/>
 <path d="M1066 387l42 24-28 24-41-23z" fill="#b39868" stroke="#7f6948" stroke-width="2"/><path d="M1035 399l-20 33-33 18 20-34z" fill="#9fc5c5" stroke="#648d8c" stroke-width="2"/>
</g>
<!-- Collection tubs placed along the near edge -->
<g>
 <path d="M255 539l-25 27-53-14 27-27z" fill="#b6d9da" stroke="#64898a" stroke-width="2"/><path d="M204 552v45l53 15v-46z" fill="#79a9ab" stroke="#64898a" stroke-width="2"/><text x="229" y="580" text-anchor="middle" class="tiny" fill="#fff">GLASS</text>
 <path d="M393 542l-24 27-52-14 25-27z" fill="#e0c6b5" stroke="#997a66" stroke-width="2"/><path d="M342 555v39l52 16v-42z" fill="#bb9680" stroke="#997a66" stroke-width="2"/><text x="366" y="580" text-anchor="middle" class="tiny" fill="#fff">LAMINATE</text>
 <path d="M1084 548l-20 23-47-13 22-23z" fill="#ecd799" stroke="#9d8956" stroke-width="2"/><path d="M1039 558v34l47 13v-35z" fill="#c4a756" stroke="#9d8956" stroke-width="2"/><text x="1062" y="582" text-anchor="middle" class="tiny" fill="#fff">METAL</text>
 <path d="M1174 510l-20 22-43-12 21-23z" fill="#c9d3c4" stroke="#7e8974" stroke-width="2"/><path d="M1132 519v35l43 13v-35z" fill="#9ba796" stroke="#7e8974" stroke-width="2"/><text x="1153" y="543" text-anchor="middle" class="tiny" fill="#fff">RESIDUE</text>
</g>
<!-- station signs, standing above each module -->
<g>
 <path d="M365 273v-27M557 284v-38M746 270v-24M975 286v-40" stroke="#726348" stroke-width="2" stroke-dasharray="4 3"/>
 <rect x="314" y="210" width="183" height="43" rx="9" fill="#e5f1ed" stroke="#6c9a8f" stroke-width="2"/><text x="405" y="228" text-anchor="middle" class="tiny" fill="#19665e">1 • INSPECT</text><text x="405" y="245" text-anchor="middle" class="desc">camera + lights</text>
 <rect x="511" y="210" width="194" height="43" rx="9" fill="#edf0df" stroke="#99a66d" stroke-width="2"/><text x="608" y="228" text-anchor="middle" class="tiny" fill="#536a37">2 • REMOVE FRAME</text><text x="608" y="245" text-anchor="middle" class="desc">cardboard arm + tabs</text>
 <rect x="722" y="210" width="228" height="43" rx="9" fill="#fff0da" stroke="#dda85a" stroke-width="2"/><text x="836" y="228" text-anchor="middle" class="tiny" fill="#9a5f20">3 • SEPARATE</text><text x="836" y="245" text-anchor="middle" class="desc">blunt card tool + paper rollers</text>
 <rect x="968" y="210" width="190" height="43" rx="9" fill="#eaedf7" stroke="#8c97b6" stroke-width="2"/><text x="1063" y="228" text-anchor="middle" class="tiny" fill="#4c5d8d">4 • SORT</text><text x="1063" y="245" text-anchor="middle" class="desc">paper drum + chutes</text>
</g>
<!-- front plaque on machine -->
<path d="M597 572h324v37H597z" fill="#354d48" stroke="#253b36" stroke-width="2"/><text x="759" y="597" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#f1ead8">AGASTYA</text>

<!-- concise construction legend -->
<rect x="57" y="775" width="1386" height="161" rx="22" fill="#fffdf7" stroke="#c8b995" stroke-width="2" filter="url(#shadow)"/>
<text x="89" y="815" font-family="'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#30463c">MAKE THIS WITH REUSED MATERIALS</text>
<g font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#4e6055">
 <circle cx="110" cy="852" r="12" fill="#9c7b52"/><text x="110" y="856" text-anchor="middle" fill="#fff" font-weight="700">1</text><text x="130" y="857">Two-layer carton base + folded-cardboard legs.</text>
 <circle cx="444" cy="852" r="12" fill="#276b70"/><text x="444" y="856" text-anchor="middle" fill="#fff" font-weight="700">2</text><text x="464" y="857">Fixed paper-tube rollers and side rails.</text>
 <circle cx="760" cy="852" r="12" fill="#d98934"/><text x="760" y="856" text-anchor="middle" fill="#fff" font-weight="700">3</text><text x="780" y="857">Four colored station arches/boxes.</text>
 <circle cx="1068" cy="852" r="12" fill="#596a9c"/><text x="1068" y="856" text-anchor="middle" fill="#fff" font-weight="700">4</text><text x="1088" y="857">Paper bins, arrows and large labels.</text>
 <text x="89" y="900" font-size="13">Materials: scrap shipping box, cereal-box card, paper tubes, tape/glue, markers, optional foil and bottle caps.</text>
 <text x="1410" y="900" text-anchor="end" font-size="13" font-weight="700" fill="#8a5b1d">NO HEAT • NO BLADE • NO MOTOR • NO WIRES</text>
</g>
<text x="64" y="972" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#59695e">Display only: rollers and stations stay fixed; move the layered paper panel by hand. Stage 3 roller and Stage 4 recovery are design concepts, not demonstrated results.</text>
</svg>
