</g>
<!-- Stage 3 orange hood with blunt mock knife and paper rollers -->
<g>
 <path d="M746 435V325L793 284V394Z" fill="#d98934" fill-opacity=".86" stroke="#995c28" stroke-width="3"/>
 <path d="M746 325H906L953 284H793Z" fill="#f0b864" stroke="#995c28" stroke-width="3"/>
 <path d="M906 325V435L953 394V284" fill="none" stroke="#dc9946" stroke-width="17"/>
 <path d="M746 325h160M793 284h160" stroke="#dc9946" stroke-width="16"/>
 <!-- clearly visible blunt cardboard blade -->
 <rect x="810" y="329" width="27" height="26" rx="4" fill="#73766d" stroke="#494c45" stroke-width="2"/><path d="M821 355l-6 54h13l7-54z" fill="#ba7751" stroke="#885337" stroke-width="2"/>
 <!-- heater is only drawn on the placard -->
 <path d="M786 342h20" stroke="#a94d35" stroke-width="4" stroke-dasharray="4 3"/>
 <!-- proposed rollers from rolled paper -->
 <ellipse cx="858" cy="417" rx="19" ry="12" fill="#d48b62" stroke="#8e5645" stroke-width="3"/><path d="M839 417v-8M877 417v-8" stroke="#8e5645" stroke-width="3"/>
 <ellipse cx="900" cy="417" rx="19" ry="12" fill="#d48b62" stroke="#8e5645" stroke-width="3"/><path d="M881 417v-8M919 417v-8" stroke="#8e5645" stroke-width="3"/>
 <rect x="918" y="367" width="38" height="52" rx="5" fill="#e2dfcf" stroke="#857c69" stroke-width="2"/><rect x="924" y="375" width="26" height="15" fill="#596b63"/><text x="937" y="386" text-anchor="middle" font-family="Arial" font-size="7" font-weight="700" fill="#d7e5b9">TEMP</text><circle cx="928" cy="400" r="3" fill="#c65245"/><circle cx="941" cy="400" r="3" fill="#63946a"/>
</g>
