 <circle cx="400" cy="962" r="14" fill="#596792"/><text x="400" y="967" text-anchor="middle" class="num">6</text><text x="424" y="959" class="legend">Eddy-current rotor + belt</text><text x="424" y="979" class="note">proposed metal separation</text>
 <circle cx="755" cy="962" r="14" fill="#718b81"/><text x="755" y="967" text-anchor="middle" class="num">7</text><text x="779" y="959" class="legend">Conveyor rollers + guides</text><text x="779" y="979" class="note">move/support panel</text>
 <circle cx="1110" cy="962" r="14" fill="#718b81"/><text x="1110" y="967" text-anchor="middle" class="num">8</text><text x="1134" y="959" class="legend">Separate collection bins</text><text x="1134" y="979" class="note">glass / laminate / metal fractions</text>
