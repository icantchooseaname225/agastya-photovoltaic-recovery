 <circle cx="1110" cy="897" r="14" fill="#c47a22"/><text x="1110" y="902" text-anchor="middle" class="num">4</text><text x="1134" y="894" class="legend">Guard + hot knife</text><text x="1134" y="914" class="note">glass/laminate split</text>
