<rect x="88" y="1013" width="1420" height="72" rx="13" fill="#fff5e4" stroke="#ead4ac"/><text x="111" y="1041" class="chip" fill="#75561d">IMPORTANT:</text><text x="203" y="1041" class="note">This is an illustrative design, not a built machine. The heated roller’s EVA-removal result and all performance figures remain unverified.</text><text x="111" y="1066" class="note">Not to scale. The camera/software, robotic handling, thermal station, and metal separator are concept components. No heater or moving mechanism is shown as tested.</text>
