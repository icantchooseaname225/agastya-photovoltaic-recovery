 <rect x="380" y="128" width="300" height="66" rx="13" fill="#fff" stroke="#c7d9d0" stroke-width="2"/><circle cx="405" cy="152" r="14" fill="#176b62"/><text x="405" y="157" text-anchor="middle" class="num">2</text><text x="430" y="153" class="chip">VISION COMPUTER</text><text x="430" y="176" class="note">Runs Agastya-EYE (concept).</text><path d="M525 194l-170 260" fill="none" stroke="#718b81" stroke-width="2"/>
