 <circle cx="400" cy="897" r="14" fill="#176b62"/><text x="400" y="902" text-anchor="middle" class="num">2</text><text x="424" y="894" class="legend">Computer + panel tester</text><text x="424" y="914" class="note">triage / reuse decision</text>
