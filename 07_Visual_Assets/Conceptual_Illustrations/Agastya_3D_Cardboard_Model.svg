<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7faf7"/><stop offset="1" stop-color="#e9f0eb"/></linearGradient>
 <filter id="shadow" x="-20%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#203d36" flood-opacity=".18"/></filter>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#176b62"/></marker>
 <style>.title{font:700 39px 'Segoe UI',Arial,sans-serif;fill:#153d39}.sub{font:400 18px 'Segoe UI',Arial,sans-serif;fill:#56716a}.label{font:700 16px 'Segoe UI',Arial,sans-serif;fill:#173f3a}.small{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#385b54;letter-spacing:.3px}.tag{font:700 13px 'Segoe UI',Arial,sans-serif;letter-spacing:.8px}.call{font:600 14px 'Segoe UI',Arial,sans-serif;fill:#47635c}.num{font:700 13px Arial,sans-serif;fill:white}</style>
</defs>
<rect width="1500" height="1000" fill="url(#bg)"/><circle cx="1350" cy="120" r="185" fill="#e1eee6"/>
<text x="66" y="72" class="title">AGASTYA</text><text x="68" y="108" class="sub">3D-style view of the no-cost cardboard display model</text>
<rect x="1138" y="49" width="294" height="44" rx="22" fill="#fff2d9" stroke="#e5c47d"/><text x="1285" y="77" text-anchor="middle" class="tag" fill="#805716">NON-WORKING CONCEPT MODEL</text>
<ellipse cx="758" cy="700" rx="560" ry="90" fill="#c7d5cc" opacity=".55"/>
<!-- Raised base, top and sides -->
<g filter="url(#shadow)"><path d="M170 550H1200V638H170Z" fill="#385958" stroke="#284444" stroke-width="3"/><path d="M1200 550L1300 440V528L1200 638Z" fill="#294847" stroke="#284444" stroke-width="3"/><path d="M170 550H1200L1300 440H270Z" fill="#72918a" stroke="#385958" stroke-width="3"/><path d="M190 542H1188L1277 450H279Z" fill="#d8e5dc" stroke="#b1c5b9" stroke-width="2"/></g>
<!-- decorative supports and wheels -->
<path d="M250 636v36M485 636v36M1020 636v36M1190 621v42" stroke="#617b76" stroke-width="13"/>
<g fill="#263c3c"><ellipse cx="250" cy="682" rx="30" ry="19"/><ellipse cx="485" cy="682" rx="30" ry="19"/><ellipse cx="1020" cy="682" rx="30" ry="19"/><ellipse cx="1190" cy="658" rx="30" ry="19"/></g><g fill="#c7d2cb"><ellipse cx="250" cy="682" rx="12" ry="8"/><ellipse cx="485" cy="682" rx="12" ry="8"/><ellipse cx="1020" cy="682" rx="12" ry="8"/><ellipse cx="1190" cy="658" rx="12" ry="8"/></g>
<!-- Center panel path -->
<path d="M300 534H1110L1190 451H380Z" fill="#bfd7d2" stroke="#718f87" stroke-width="2"/><path d="M325 520H1098L1160 456H387Z" fill="#4d8992" stroke="#2f6870" stroke-width="2"/><path d="M490 520l63-64M675 520l63-64M860 520l63-64M1045 520l63-64" stroke="#d5efea" stroke-width="4"/>
<path d="M370 485H1080" stroke="#176b62" stroke-width="5" marker-end="url(#arrow)"/><rect x="600" y="461" width="250" height="32" rx="16" fill="#f7fbf8"/><text x="725" y="482" text-anchor="middle" class="small">PRETEND PANEL GOES THIS WAY</text>
<!-- layered sample panel -->
<path d="M390 503H545L574 474H419Z" fill="#263f49" stroke="#173b40" stroke-width="2"/><path d="M397 498H540L563 477H420Z" fill="#458594"/><path d="M432 498l22-21M468 498l22-21M504 498l22-21" stroke="#d5eee8" stroke-width="3"/>
<!-- Camera arch -->
<path d="M475 448V320L535 260V388Z" fill="#1d665f" stroke="#174e49" stroke-width="3"/><path d="M475 320H555L615 260H535Z" fill="#50a097" stroke="#174e49" stroke-width="3"/><path d="M555 320V448L615 388V260" fill="none" stroke="#2c8178" stroke-width="18"/><path d="M475 320h80M535 260h80" stroke="#26756c" stroke-width="17"/><path d="M512 319l22-22h28l-22 22Z" fill="#24494a" stroke="#133d3d" stroke-width="2"/><circle cx="536" cy="309" r="8" fill="#f2c869" stroke="#7b622d" stroke-width="2"/>
<!-- Frame removal arch -->
<path d="M650 448V328L710 268V388Z" fill="#687c3e" stroke="#526631" stroke-width="3"/><path d="M650 328H750L810 268H710Z" fill="#9aaa64" stroke="#526631" stroke-width="3"/><path d="M750 328V448L810 388V268" fill="none" stroke="#81934f" stroke-width="18"/><path d="M650 328h100M710 268h100" stroke="#81934f" stroke-width="17"/><rect x="693" y="331" width="45" height="46" rx="4" fill="#d9dfb6" stroke="#526631" stroke-width="3"/><path d="M716 377v42" stroke="#6e4f34" stroke-width="7" stroke-linecap="round"/><path d="M630 521l32-31 10 5-32 32zM670 526l29-30 10 6-29 30z" fill="#ba9b5e" stroke="#8a7143" stroke-width="2"/>
<!-- separator cover -->
<path d="M825 448V322L885 262V388Z" fill="#c58238" fill-opacity=".65" stroke="#a76729" stroke-width="3"/><path d="M825 322H957L1017 262H885Z" fill="#f0bd75" stroke="#a76729" stroke-width="3"/><path d="M957 322V448L1017 388V262" fill="none" stroke="#d79649" stroke-width="18"/><path d="M825 322h132M885 262h132" stroke="#d79649" stroke-width="17"/><path d="M886 343h10l-8 64h-10z" fill="#98563b" stroke="#703d2c" stroke-width="2"/>
<!-- sorting box, paper symbol and chutes -->
<path d="M1040 449V340L1100 280V389Z" fill="#596792" stroke="#424f78" stroke-width="3"/><path d="M1040 340H1170L1230 280H1100Z" fill="#8995be" stroke="#424f78" stroke-width="3"/><path d="M1170 340V449L1230 389V280" fill="#49577f" stroke="#424f78" stroke-width="3"/><path d="M1060 344h93l42-42h-93z" fill="#dce2f2" stroke="#aab4d4" stroke-width="2"/><circle cx="1118" cy="326" r="17" fill="#aeb8da" stroke="#65739f" stroke-width="3"/><path d="M1118 312v28M1104 326h28" stroke="#65739f" stroke-width="3"/><path d="M1170 397l88 31-42 43-88-31z" fill="#cdb791" stroke="#8e7754" stroke-width="3"/><path d="M1129 419l-6 41-54 29 6-42z" fill="#9ac4c6" stroke="#638e90" stroke-width="3"/>
<!-- Human-readable callout labels -->
<path d="M540 242l-55-35H350" fill="none" stroke="#648078" stroke-width="2"/><circle cx="540" cy="242" r="5" fill="#176b62"/><rect x="78" y="173" width="274" height="72" rx="13" fill="white" stroke="#c8d9d0" stroke-width="2"/><circle cx="102" cy="198" r="14" fill="#176b62"/><text x="102" y="203" text-anchor="middle" class="num">1</text><text x="125" y="199" class="label">CAMERA ARCH</text><text x="125" y="224" class="call">A paper camera sits above panel.</text>
<path d="M710 249l-40-49h450" fill="none" stroke="#648078" stroke-width="2"/><circle cx="710" cy="249" r="5" fill="#667b3f"/><rect x="1115" y="151" width="322" height="68" rx="13" fill="white" stroke="#d4dcc1" stroke-width="2"/><circle cx="1141" cy="176" r="14" fill="#667b3f"/><text x="1141" y="181" text-anchor="middle" class="num">2</text><text x="1164" y="177" class="label">FRAME AREA</text><text x="1164" y="201" class="call">Loose card strips show the frame.</text>
<path d="M917 242l43-51h57" fill="none" stroke="#648078" stroke-width="2"/><circle cx="917" cy="242" r="5" fill="#c47a22"/><rect x="706" y="143" width="309" height="63" rx="13" fill="white" stroke="#ead0a9" stroke-width="2"/><circle cx="732" cy="166" r="14" fill="#c47a22"/><text x="732" y="171" text-anchor="middle" class="num">3</text><text x="755" y="167" class="label">COVERED SEPARATOR</text><text x="755" y="190" class="call">Blunt card piece represents tool.</text>
<path d="M1130 278l70-36h30" fill="none" stroke="#648078" stroke-width="2"/><circle cx="1130" cy="278" r="5" fill="#596792"/><rect x="1215" y="225" width="221" height="61" rx="13" fill="white" stroke="#cbd0e5" stroke-width="2"/><circle cx="1240" cy="248" r="14" fill="#596792"/><text x="1240" y="253" text-anchor="middle" class="num">4</text><text x="1263" y="249" class="label">SORTING BOX</text><text x="1263" y="272" class="call">Carton and paper output chutes.</text>
<text x="448" y="558" class="small">LAYERED PAPER PANEL</text><text x="886" y="430" text-anchor="middle" class="small">CARDBOARD TOOL</text>
<rect x="70" y="760" width="1360" height="166" rx="23" fill="white" stroke="#d7e4dc" stroke-width="2" filter="url(#shadow)"/><text x="101" y="800" class="label" font-size="19">HOW TO COPY THIS SHAPE WITH SCRAP CARDBOARD</text>
<g font-family="'Segoe UI',Arial,sans-serif" fill="#49645e" font-size="15"><circle cx="120" cy="839" r="14" fill="#176b62"/><text x="120" y="844" text-anchor="middle" fill="white" font-weight="700">1</text><text x="145" y="844">Flat box base + two long rails = platform.</text><circle cx="570" cy="839" r="14" fill="#667b3f"/><text x="570" y="844" text-anchor="middle" fill="white" font-weight="700">2</text><text x="595" y="844">Fold three upside-down U arches; glue feet down.</text><circle cx="1090" cy="839" r="14" fill="#c47a22"/><text x="1090" y="844" text-anchor="middle" fill="white" font-weight="700">3</text><text x="1115" y="844">Add one box and paper trays at end.</text><circle cx="120" cy="885" r="14" fill="#596792"/><text x="120" y="890" text-anchor="middle" fill="white" font-weight="700">4</text><text x="145" y="890">Keep the center lane open; slide panel by hand.</text><text x="850" y="890" font-weight="700" fill="#805716">Everything stays still except the paper panel.</text></g>
<text x="72" y="968" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#5c716b">Scrap carton, paper, glue/tape, markers, optional bottle caps. No glass, heat, sharp blades, motors or wires.</text>
</svg>
