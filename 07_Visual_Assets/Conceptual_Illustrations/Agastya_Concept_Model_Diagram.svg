<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#163b3a" flood-opacity=".12"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#176b62"/></marker>
  <marker id="arrowSmall" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#657b78"/></marker>
  <style>
    .title{font:700 38px 'Segoe UI',Arial,sans-serif;fill:#143d3a}.sub{font:400 18px 'Segoe UI',Arial,sans-serif;fill:#53716e}
    .station{font:700 19px 'Segoe UI',Arial,sans-serif;fill:#173f3b}.desc{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#526b68}
    .tiny{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#526b68;letter-spacing:.3px}.out{font:700 15px 'Segoe UI',Arial,sans-serif;fill:#173f3b}
    .tag{font:700 13px 'Segoe UI',Arial,sans-serif;letter-spacing:1px}.note{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#455f5b}
  </style>
</defs>
<!-- background -->
<rect width="1600" height="1060" fill="#f3f7f4"/>
<circle cx="1480" cy="80" r="160" fill="#e6f0e9"/>
<text x="72" y="76" class="title">AGASTYA | ZERO-COST CONCEPT MODEL</text>
<text x="74" y="111" class="sub">A clean tabletop display of the proposed solar-panel recovery journey</text>
<rect x="1274" y="49" width="252" height="43" rx="21" fill="#fff0d9" stroke="#e7bd74"/>
<text x="1400" y="76" text-anchor="middle" class="tag" fill="#8b5a13">NON-WORKING DISPLAY</text>

<!-- base board -->
<rect x="58" y="158" width="1484" height="668" rx="30" fill="#fff" stroke="#d8e5dd" stroke-width="2" filter="url(#shadow)"/>
<text x="91" y="198" class="tiny">TOP VIEW • BUILD ON A SCRAP CARDBOARD BASE ABOUT 60 × 35 CM</text>
<line x1="92" y1="218" x2="1505" y2="218" stroke="#e5ece7" stroke-width="2"/>

<!-- incoming panel -->
<text x="95" y="267" class="tiny">INPUT</text>
<g transform="translate(91 289)">
 <rect x="0" y="0" width="111" height="146" rx="9" fill="#253f45"/>
 <rect x="8" y="8" width="95" height="130" rx="4" fill="#2e7180"/>
 <path d="M39 8v130 M70 8v130 M8 51h95 M8 95h95" stroke="#d8f1ec" stroke-width="3" opacity=".85"/>
 <path d="M0 153h111" stroke="#176b62" stroke-width="3" marker-end="url(#arrow)"/>
</g>
<text x="146" y="469" text-anchor="middle" class="desc">Retired panel</text>
<text x="146" y="489" text-anchor="middle" class="desc">card + paper layers</text>

<!-- station 1 -->
<g filter="url(#shadow)"><rect x="244" y="263" width="244" height="265" rx="20" fill="#eaf5f1" stroke="#b9d9cf" stroke-width="2"/></g>
<circle cx="274" cy="293" r="18" fill="#176b62"/><text x="274" y="299" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">1</text>
<text x="302" y="299" class="station">INSPECT &amp; TRIAGE</text>
<text x="267" y="328" class="desc">Agastya-EYE concept</text>
<!-- camera stand -->
<path d="M338 356v51 M313 407h50 M327 356h23l9 18h-41z" fill="none" stroke="#176b62" stroke-width="5" stroke-linejoin="round"/>
<rect x="329" y="350" width="22" height="11" rx="3" fill="#176b62"/>
<path d="M340 411v14" stroke="#176b62" stroke-width="3" stroke-dasharray="4 5"/>
<text x="366" y="379" class="tiny">PAPER</text><text x="366" y="397" class="tiny">CAMERA</text>
<rect x="266" y="444" width="200" height="58" rx="12" fill="#fff" stroke="#c9e0d7"/>
<text x="366" y="468" text-anchor="middle" class="out">Reuse check first</text>
<text x="366" y="489" text-anchor="middle" class="desc">Still-working panel → reuse</text>

<!-- branch reuse -->
<path d="M488 392h46v-102h73" fill="none" stroke="#78918a" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowSmall)"/>
<rect x="611" y="263" width="196" height="78" rx="16" fill="#f4f8e8" stroke="#d8e2a9" stroke-width="2"/>
<text x="709" y="294" text-anchor="middle" class="out">SECOND-LIFE REUSE</text><text x="709" y="317" text-anchor="middle" class="desc">shown as a side route</text>

<!-- main flow arrow -->
<path d="M488 455h39" stroke="#176b62" stroke-width="4" marker-end="url(#arrow)"/>

<!-- station 2 -->
<g filter="url(#shadow)"><rect x="536" y="374" width="244" height="265" rx="20" fill="#f1f4e9" stroke="#d8dfbd" stroke-width="2"/></g>
<circle cx="566" cy="404" r="18" fill="#61773c"/><text x="566" y="410" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">2</text>
<text x="594" y="410" class="station">REMOVE FRAME</text>
<text x="559" y="439" class="desc">Manual concept step</text>
<!-- panel with lift-off frame -->
<rect x="599" y="461" width="112" height="74" rx="5" fill="#d4e8e4" stroke="#547c74" stroke-width="3"/>
<rect x="589" y="451" width="112" height="74" rx="5" fill="none" stroke="#8b7143" stroke-width="6" stroke-dasharray="13 7"/>
<path d="M704 454q30-24 41-2" fill="none" stroke="#8b7143" stroke-width="3" marker-end="url(#arrowSmall)"/>
<text x="658" y="567" text-anchor="middle" class="tiny">LIFT-OFF FRAME STRIPS</text>
<text x="658" y="593" text-anchor="middle" class="desc">Paper tabs make them removable</text>
<rect x="553" y="606" width="210" height="22" rx="11" fill="#e6ebd5"/>
<text x="658" y="622" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#52653a">FRAME + JUNCTION BOX</text>

<!-- removed materials tray -->
<path d="M658 640v31" stroke="#78918a" stroke-width="3" stroke-dasharray="5 5" marker-end="url(#arrowSmall)"/>
<rect x="563" y="683" width="191" height="69" rx="12" fill="#faf8ee" stroke="#ded5b7" stroke-width="2"/>
<text x="658" y="711" text-anchor="middle" class="out">REMOVED PARTS</text><text x="658" y="734" text-anchor="middle" class="desc">cardboard frame + box</text>

<!-- arrow station 2 to 3 -->
<path d="M780 500h39" stroke="#176b62" stroke-width="4" marker-end="url(#arrow)"/>

<!-- station 3 -->
<g filter="url(#shadow)"><rect x="828" y="374" width="244" height="265" rx="20" fill="#fff3e2" stroke="#edcf9e" stroke-width="2"/></g>
<circle cx="858" cy="404" r="18" fill="#c47a22"/><text x="858" y="410" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">3</text>
<text x="886" y="410" class="station">SEPARATE GLASS</text>
<text x="851" y="439" class="desc">Hot-knife idea • no heat used</text>
<!-- layered sandwich and blade -->
<rect x="869" y="476" width="157" height="20" rx="3" fill="#9ccbd1" stroke="#63949b"/>
<rect x="869" y="499" width="157" height="14" rx="3" fill="#f3d88c" stroke="#d8b750"/>
<rect x="869" y="516" width="157" height="20" rx="3" fill="#d9a8a0" stroke="#ae7770"/>
<path d="M941 454l20 0-8 57h-11z" fill="#9c563c" stroke="#713b2c" stroke-width="2"/>
<text x="950" y="554" text-anchor="middle" class="tiny">CARDBOARD “BLADE”</text>
<text x="950" y="579" text-anchor="middle" class="desc">Glass layer / bonded laminate</text>
<rect x="846" y="606" width="208" height="22" rx="11" fill="#fae5c7"/>
<text x="950" y="622" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#8a5b1d">ILLUSTRATES THE SPLIT ONLY</text>

<!-- glass + laminate outputs -->
<path d="M882 640v31h-55" fill="none" stroke="#78918a" stroke-width="3" stroke-dasharray="5 5" marker-end="url(#arrowSmall)"/>
<path d="M1019 640v31h45" fill="none" stroke="#78918a" stroke-width="3" stroke-dasharray="5 5" marker-end="url(#arrowSmall)"/>
<rect x="797" y="683" width="156" height="69" rx="12" fill="#edf7f7" stroke="#bad9db" stroke-width="2"/>
<text x="875" y="711" text-anchor="middle" class="out">GLASS STREAM</text><text x="875" y="734" text-anchor="middle" class="desc">blue paper / foil</text>
<rect x="967" y="683" width="185" height="69" rx="12" fill="#f8eeee" stroke="#e2c4bd" stroke-width="2"/>
<text x="1059" y="711" text-anchor="middle" class="out">CELL + EVA LAMINATE</text><text x="1059" y="734" text-anchor="middle" class="desc">layered paper panel</text>

<!-- arrow to stage 4 -->
<path d="M1072 500h39" stroke="#176b62" stroke-width="4" marker-end="url(#arrow)"/>

<!-- station 4 -->
<g filter="url(#shadow)"><rect x="1120" y="374" width="244" height="265" rx="20" fill="#edf0fb" stroke="#c8cde7" stroke-width="2"/></g>
<circle cx="1150" cy="404" r="18" fill="#5767a5"/><text x="1150" y="410" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">4</text>
<text x="1178" y="410" class="station">MATERIAL SORTING</text>
<text x="1143" y="439" class="desc">Proposed downstream step</text>
<!-- paper drum -->
<ellipse cx="1242" cy="481" rx="52" ry="18" fill="#cad0ec" stroke="#6c78ae" stroke-width="3"/>
<path d="M1190 481v55c0 10 23 18 52 18s52-8 52-18v-55" fill="#e1e4f4" stroke="#6c78ae" stroke-width="3"/>
<ellipse cx="1242" cy="536" rx="52" ry="18" fill="#e1e4f4" stroke="#6c78ae" stroke-width="3"/>
<path d="M1188 478q-22 4-25 28M1295 476q21 4 26 28" fill="none" stroke="#6c78ae" stroke-width="3" stroke-dasharray="5 5" marker-end="url(#arrowSmall)"/>
<text x="1242" y="591" text-anchor="middle" class="tiny">PAPER ROLL = SORTER SYMBOL</text>
<rect x="1138" y="606" width="208" height="22" rx="11" fill="#dfe3f5"/>
<text x="1242" y="622" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#515e99">NO MOTOR / NO RECOVERY TEST</text>

<!-- final handoff -->
<path d="M1242 640v35" stroke="#78918a" stroke-width="3" stroke-dasharray="5 5" marker-end="url(#arrowSmall)"/>
<rect x="1150" y="683" width="190" height="69" rx="12" fill="#f5f2f9" stroke="#d4cbe2" stroke-width="2"/>
<text x="1245" y="711" text-anchor="middle" class="out">SPECIALIST HAND-OFF</text><text x="1245" y="734" text-anchor="middle" class="desc">not silver extraction</text>

<!-- flow labels -->
<text x="507" y="447" text-anchor="middle" class="tiny">RECYCLE ROUTE</text>
<text x="800" y="475" text-anchor="middle" class="tiny">PANEL</text>
<text x="1094" y="475" text-anchor="middle" class="tiny">LAMINATE</text>

<!-- bottom instruction band -->
<rect x="58" y="851" width="1484" height="153" rx="24" fill="#e8f0eb" stroke="#d2e1d7" stroke-width="2"/>
<text x="91" y="892" class="station">HOW TO MAKE IT LOOK LIKE A REAL EXHIBIT</text>
<g transform="translate(92 919)">
 <circle cx="10" cy="10" r="10" fill="#176b62"/><text x="10" y="15" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#fff">1</text>
 <text x="30" y="15" class="note">Use one flat base; keep the 4 stations in a straight line.</text>
 <circle cx="540" cy="10" r="10" fill="#61773c"/><text x="540" y="15" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#fff">2</text>
 <text x="560" y="15" class="note">Make each station a small raised carton with one large label.</text>
 <circle cx="1075" cy="10" r="10" fill="#c47a22"/><text x="1075" y="15" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#fff">3</text>
 <text x="1095" y="15" class="note">Use paper arrows and matching color-coded output trays.</text>
</g>
<text x="92" y="974" class="desc">Materials: clean waste cardboard, scrap paper, a little foil, marker, glue/tape. Keep all parts blunt and clearly labeled.</text>
<text x="1505" y="974" text-anchor="end" class="tiny">HONEST LABEL: DESIGN MODEL • NOT A WORKING MACHINE</text>
</svg>
